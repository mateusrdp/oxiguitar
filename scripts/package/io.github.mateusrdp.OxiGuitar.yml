# The OxiGuitar Flatpak (#163, docs/design/flatpak.md), built by the release
# workflow (.github/workflows/release.yml, job "Flatpak") into a single-file
# bundle per processor, OxiGuitar-VERSION-ARCH.flatpak. oxiguitar-packages'
# Site workflow imports the bundles of published releases into our Flatpak
# repository.
#
# It holds no plugin: each plugin is a package of its own, an extension of
# this one (io.github.mateusrdp.OxiGuitar.Plugin.NAME, made by
# oxiguitar-packages' plugin-release.yml), and the sandbox is Flatpak's
# default: no access to the user's files (scores come through the desktop
# portal) or to the system's.
id: io.github.mateusrdp.OxiGuitar
branch: stable
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
# Starts the Wayland or the X11 build, as the AppImage's AppRun does.
command: oxiguitar-start
# English only: no translations to split off.
separate-locales: false
finish-args:
  # Both builds, as in the AppImage: Wayland where the session has it, X11
  # only where it doesn't (fallback-x11), chosen by oxiguitar-start.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL for Slint's femtovg renderer.
  - --device=dri
  # Sound: the ALSA plugin reaches the sound server through the runtime's
  # ALSA configuration, the PipeWire plugin through PipeWire's socket.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0:ro
add-extensions:
  # Each plugin is an extension, io.github.mateusrdp.OxiGuitar.Plugin.NAME,
  # mounted at /app/lib/oxiguitar/NAME with its .oxp files in plugins/.
  # Flatpak links every installed extension's plugins/ folder into
  # /app/lib/oxiguitar/plugins, the system plugin folder OxiGuitar derives
  # from /app/bin/oxiguitar (oxiguitar-host's folders.rs), so the core needs
  # no Flatpak code. No plugin comes with the app on its own.
  io.github.mateusrdp.OxiGuitar.Plugin:
    directory: lib/oxiguitar
    subdirectories: true
    merge-dirs: plugins
    no-autodownload: true
    autodelete: true
modules:
  - name: oxiguitar
    buildsystem: simple
    build-options:
      # Our own repository, not Flathub: the build may reach the network
      # for rustup and the crates (Cargo.lock pins them).
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/oxiguitar/.cargo-home
        RUSTUP_HOME: /run/build/oxiguitar/.rustup-home
        CARGO_TERM_COLOR: always
    build-commands:
      # Rust as Cargo.toml's rust-version asks.
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99 --no-modify-path
      - .cargo-home/bin/cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli
      - .cargo-home/bin/cargo build --release --locked -p oxiguitar-app --no-default-features --features x11 --target-dir target/x11
      - install -Dm755 target/release/oxiguitar /app/bin/oxiguitar
      - install -Dm755 target/x11/release/oxiguitar /app/bin/oxiguitar-x11
      - install -Dm755 scripts/package/oxiguitar-start /app/bin/oxiguitar-start
      - install -Dm755 target/release/oxiguitar-cli /app/bin/oxiguitar-cli
      # The extension point's folder (Flatpak mounts the plugins under it).
      - install -d /app/lib/oxiguitar
      # The menu entry starts the launcher: Flatpak runs the command its Exec
      # line names, which would otherwise always be the Wayland build.
      - sed 's/^Exec=oxiguitar /Exec=oxiguitar-start /' assets/linux/io.github.mateusrdp.OxiGuitar.desktop > io.github.mateusrdp.OxiGuitar.desktop
      - grep -qx 'Exec=oxiguitar-start %f' io.github.mateusrdp.OxiGuitar.desktop
      - install -Dm644 io.github.mateusrdp.OxiGuitar.desktop /app/share/applications/io.github.mateusrdp.OxiGuitar.desktop
      - install -Dm644 assets/linux/io.github.mateusrdp.OxiGuitar.xml /app/share/mime/packages/io.github.mateusrdp.OxiGuitar.xml
      - install -Dm644 assets/linux/io.github.mateusrdp.OxiGuitar.metainfo.xml /app/share/metainfo/io.github.mateusrdp.OxiGuitar.metainfo.xml
      # The PNG icons only (16 to 512 px): appstreamcli compose refuses the
      # scalable SVG ("Unrecognized image file format"), which stays in the
      # other packages (Mateus, 9 Nov 2026).
      - for s in 16 24 32 48 64 128 256 512; do install -Dm644 assets/icon/png/oxiguitar-$s.png /app/share/icons/hicolor/${s}x${s}/apps/io.github.mateusrdp.OxiGuitar.png; done
      # The licences, as the other packages carry them.
      - install -Dm644 LICENSE /app/share/licenses/io.github.mateusrdp.OxiGuitar/LICENSE
      - install -Dm644 dist/THIRD-PARTY-LICENSES.html /app/share/licenses/io.github.mateusrdp.OxiGuitar/THIRD-PARTY-LICENSES.html
      - install -Dm644 assets/fonts/bravura/OFL.txt /app/share/licenses/io.github.mateusrdp.OxiGuitar/fonts/Bravura-OFL.txt
      - install -Dm644 assets/fonts/noto-sans/OFL.txt /app/share/licenses/io.github.mateusrdp.OxiGuitar/fonts/NotoSans-OFL.txt
      - install -Dm644 CREDITS.md /app/share/doc/io.github.mateusrdp.OxiGuitar/CREDITS.md
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .ua
