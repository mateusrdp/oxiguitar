# cargo-about configuration: the third-party licence file shipped with every
# release package (THIRD-PARTY-LICENSES.html, made by
# scripts/package/licenses.sh). It lists every crate compiled into the
# programs, with its licence text. cargo-deny (deny.toml) decides which
# licences are allowed; this list only has to accept the same ones.

accepted = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Unlicense",
]

# What ships: the desktop app and the command-line tool, on every release
# target. Build tools and test-only crates are not in the packages.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
