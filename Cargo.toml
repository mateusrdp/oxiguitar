[workspace]
resolver = "3"
members = ["crates/*"]
# Throwaway experiments with their own workspaces and lock files (see
# spikes/README.md), and the fuzz targets (nightly Rust, see fuzz/README.md).
exclude = ["spikes", "fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Follows the rustc in Debian unstable, so apt's toolchain always builds OxiGuitar.
rust-version = "1.97"
license = "GPL-3.0-or-later"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
repository = "https://github.com/mateusrdp/oxiguitar"
homepage = "https://github.com/mateusrdp/oxiguitar"
publish = false

[workspace.dependencies]
oxiguitar-model = { path = "crates/oxiguitar-model" }
oxiguitar-formats = { path = "crates/oxiguitar-formats" }
oxiguitar-display = { path = "crates/oxiguitar-display" }
oxiguitar-layout = { path = "crates/oxiguitar-layout" }
oxiguitar-render = { path = "crates/oxiguitar-render" }
oxiguitar-tools = { path = "crates/oxiguitar-tools" }
oxiguitar-testgen = { path = "crates/oxiguitar-testgen" }
# Fonts: skrifa reads outlines and metrics; keep it on the version krilla uses.
skrifa = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Guitar Pro 7/8 files are ZIP archives. No default features: they build
# the zstd C library. zlib-rs is a pure-Rust deflate.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# XML for GPIF (Guitar Pro 6-8), and later MuseScore and MusicXML.
quick-xml = "0.42"
# Pixel output for the screen, PNG and visual regression tests.
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
# PDF output. No default features: we position every glyph ourselves and
# embed no raster images yet.
krilla = { version = "0.8", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
