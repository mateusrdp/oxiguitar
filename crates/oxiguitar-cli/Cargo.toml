[package]
name = "oxiguitar-cli"
description = "Command-line tool to inspect, convert and test OxiGuitar files without a window."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The score as format plugins hand it over (`wire`); the core reads no
# format itself.
oxiguitar-model = { workspace = true, features = ["wire"] }
oxiguitar-host.workspace = true
oxiguitar-display.workspace = true
oxiguitar-layout.workspace = true
oxiguitar-render.workspace = true
oxiguitar-tools.workspace = true
# The engine, with instrument plugins as its sources (`play`).
oxiguitar-play = { workspace = true, features = ["host"] }

[dev-dependencies]
# tests/cli.rs runs the program with our format plugins, built as .oxp files.
oxiguitar-plugin-test.workspace = true

[lints]
workspace = true
