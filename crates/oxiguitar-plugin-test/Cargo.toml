[package]
name = "oxiguitar-plugin-test"
description = "The OxiGuitar plugin contract suite: builds a plugin as an .oxp file and checks it against the plugin interface."
# The SDK follows the plugin interface's version, not the program's
# (#165): 1.7.0 until interface 1.8.
version = "1.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `released` (src/released.rs): the plugins of the latest releases for the
# tests of OxiGuitar's own crates, which read Guitar Pro files and play through
# the plugins in their repositories (#165). Off for plugin authors.
released = ["dep:oxiguitar-model"]

[dependencies]
oxiguitar-host.workspace = true
oxiguitar-model = { workspace = true, features = ["wire"], optional = true }

# Catching system calls while a plugin renders (src/syscalls.rs): fork,
# seccomp and a signal handler.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
# tests/ours.rs: our plugins read every file exactly as the readers do
# in-process.
oxiguitar-model = { workspace = true, features = ["wire"] }
# The engine playing the test plugin's instrument (tests/contract.rs).
oxiguitar-play = { workspace = true, features = ["host"] }

# src/syscalls.rs is the one module with `unsafe` code (Linux), so the
# crate denies it (which a module can allow) rather than forbidding it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
undocumented_unsafe_blocks = "warn"
