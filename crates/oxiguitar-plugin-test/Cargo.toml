[package]
name = "oxiguitar-plugin-test"
description = "The OxiGuitar plugin contract suite: builds a plugin as an .oxp file and checks it against the plugin interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://mateusrdp.github.io/oxiguitar/plugins/"
documentation = "https://docs.rs/oxiguitar-plugin-test"
readme = "README.md"
keywords = ["oxiguitar", "plugin", "testing", "guitar", "tablature"]
categories = ["development-tools::testing"]
# On crates.io, for plugin authors (Mateus, 19 Oct 2026; the release
# workflow publishes it on a v* tag).
publish = true
# Its tests drive this repository's own plugins; they stay here.
exclude = ["tests/"]

[dependencies]
oxiguitar-host.workspace = true

[dev-dependencies]
serde_json.workspace = true
# tests/ours.rs: our plugins read every file exactly as the readers do
# in-process.
oxiguitar-formats.workspace = true
oxiguitar-model = { workspace = true, features = ["wire"] }

[lints]
workspace = true
