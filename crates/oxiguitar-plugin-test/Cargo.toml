[package]
name = "oxiguitar-plugin-test"
description = "The OxiGuitar plugin contract suite: builds a plugin as an .oxp file and checks it against the plugin interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oxiguitar-host.workspace = true

# Catching system calls while a plugin renders (src/syscalls.rs): fork,
# seccomp and a signal handler.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json.workspace = true
# tests/ours.rs: our plugins read every file exactly as the readers do
# in-process.
oxiguitar-formats.workspace = true
oxiguitar-model = { workspace = true, features = ["wire"] }
# The engine playing the test plugin's instrument (tests/contract.rs).
oxiguitar-play = { workspace = true, features = ["host"] }

# src/syscalls.rs is the one module with `unsafe` code (Linux), so the
# crate denies it (which a module can allow) rather than forbidding it.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
undocumented_unsafe_blocks = "warn"
