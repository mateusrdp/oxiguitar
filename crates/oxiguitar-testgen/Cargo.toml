[package]
name = "oxiguitar-testgen"
description = "Generated test scores for OxiGuitar: a small text notation for music, written out as Guitar Pro 7 files, with the visual-regression references and the speed-budget score built from it. Test code only; never part of the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
oxiguitar-layout.workspace = true
zip.workspace = true

[dev-dependencies]
oxiguitar-formats.workspace = true
oxiguitar-model = { workspace = true, features = ["wire"] }
# tests/visual.rs reads the references through our format plugin, as the
# app does.
oxiguitar-host.workspace = true
oxiguitar-plugin-test.workspace = true
oxiguitar-display.workspace = true
oxiguitar-render.workspace = true
tiny-skia.workspace = true
# Reference pictures are saved in grayscale where they can be, at the best
# compression, to keep the repository small (tiny-skia uses the same crate).
png = "0.18"
# tests/guitar_pro_7_6.rs compares the .gp writer's XML with Guitar Pro's.
quick-xml.workspace = true

[lints]
workspace = true
