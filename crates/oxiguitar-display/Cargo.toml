[package]
name = "oxiguitar-display"
description = "The display list OxiGuitar's layout produces and every renderer draws, plus the fonts it refers to."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Plugin canvases: their display list (oxiguitar-plugin-api's `display`) as
# the core's own.
wire = ["dep:oxiguitar-plugin-api"]

[dependencies]
skrifa.workspace = true
serde = { workspace = true }
serde_json.workspace = true
oxiguitar-plugin-api = { workspace = true, optional = true }

[lints]
workspace = true
