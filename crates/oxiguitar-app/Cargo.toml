[package]
name = "oxiguitar-app"
description = "The OxiGuitar desktop window: open, view and export Guitar Pro scores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "oxiguitar"
path = "src/main.rs"

[dependencies]
# The score as format plugins hand it over (`wire`); the core reads no
# format itself.
oxiguitar-model = { workspace = true, features = ["wire"] }
oxiguitar-display.workspace = true
oxiguitar-layout.workspace = true
oxiguitar-render.workspace = true
oxiguitar-tools.workspace = true
oxiguitar-host.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
# GUI (ADR 0004). unstable-winit-030: the window's raw events, for the
# zooms (wheel and Ctrl + wheel) before any widget sees them. No default
# features: those bring Slint's system-tray support (ksni, a D-Bus client),
# which the app never uses, and the app carries no code it can't use
# (docs/design/plugins.md). Both renderers stay: the software renderer is
# Slint's fallback where OpenGL isn't available.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "unstable-winit-030",
] }
# The system's own Open and Save dialogs: the XDG desktop portal on Linux
# (pure Rust, no GTK), the native dialogs on Windows and macOS.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[dev-dependencies]
# The speed budget's 300-bar, 8-track score (src/speed.rs).
oxiguitar-testgen.workspace = true
# Our format plugins, built as .oxp files for the tests (src/test_support.rs).
oxiguitar-plugin-test.workspace = true

[build-dependencies]
slint-build = "1.18"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: the code Slint generates for ui/app.slint allows it locally,
# which "forbid" would refuse. Our own code still may not use unsafe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
