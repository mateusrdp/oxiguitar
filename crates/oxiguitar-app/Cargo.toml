[package]
name = "oxiguitar-app"
description = "The OxiGuitar desktop window: open, view and export Guitar Pro scores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "oxiguitar"
path = "src/main.rs"

[dependencies]
oxiguitar-model.workspace = true
oxiguitar-formats.workspace = true
oxiguitar-display.workspace = true
oxiguitar-layout.workspace = true
oxiguitar-render.workspace = true
oxiguitar-tools.workspace = true
tiny-skia.workspace = true
# GUI (ADR 0004). unstable-winit-030: the window's raw events, for interface
# zoom (Ctrl + wheel) before any widget sees them.
slint = { version = "1.18", features = ["unstable-winit-030"] }
# The system's own Open and Save dialogs: the XDG desktop portal on Linux
# (pure Rust, no GTK), the native dialogs on Windows and macOS.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

# File drops on Wayland (src/wayland_drop.rs), a stopgap until winit or
# Slint report them: ADR 0006. The same crates and versions winit already
# uses, so nothing new is built or linked; client_system talks through the
# system's libwayland-client, which winit uses too. Remove both with the
# module.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
wayland-client = "0.31.15"
wayland-backend = { version = "0.3.17", features = ["client_system"] }

[dev-dependencies]
# The speed budget's 300-bar, 8-track score (src/speed.rs).
oxiguitar-testgen.workspace = true

[build-dependencies]
slint-build = "1.18"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: the code Slint generates for ui/app.slint allows it locally,
# which "forbid" would refuse. Our own code may not use unsafe, except the
# one call in src/wayland_drop.rs (ADR 0006, CONTRIBUTING.md).
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
