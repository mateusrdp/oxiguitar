[package]
name = "oxiguitar-app"
description = "The OxiGuitar desktop window: open, view and export Guitar Pro scores."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "oxiguitar"
path = "src/main.rs"

# The two Linux builds (Mateus, 18 Oct 2026; docs/design/plugins.md): the
# Wayland build, the default and the main one, and the X11 build,
# deprecated from the start. Each carries only its own display system's
# code: `cargo build -p oxiguitar-app` builds the Wayland one,
# `cargo build -p oxiguitar-app --no-default-features --features x11` the
# X11 one. On Windows and macOS the feature only picks the winit backend.
[features]
default = ["wayland"]
wayland = ["slint/backend-winit-wayland", "rfd/wayland"]
x11 = ["slint/backend-winit-x11"]

[dependencies]
# The score as format plugins hand it over (`wire`); the core reads no
# format itself.
oxiguitar-model = { workspace = true, features = ["wire"] }
# Plugin canvases as display lists (`wire`).
oxiguitar-display = { workspace = true, features = ["wire"] }
oxiguitar-layout.workspace = true
oxiguitar-render.workspace = true
oxiguitar-tools.workspace = true
oxiguitar-host.workspace = true
serde_json.workspace = true
tiny-skia.workspace = true
# GUI (ADR 0004). No default features: those bring Slint's system-tray
# support (ksni, a D-Bus client), which the app never uses, and the app
# carries no code it can't use (docs/design/plugins.md). Both renderers
# stay: the software renderer is Slint's fallback where OpenGL isn't
# available. The windowing backend comes from the `wayland` or `x11`
# feature below, never both in a release build.
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
] }
# The window's raw events (the wheel and Ctrl + wheel before any widget sees
# them, file drops): the crate `slint::winit_030` re-exports, taken directly
# because Slint's `unstable-winit-030` feature turns on both Linux display
# systems. Slint pins it to its own exact version, so the two never drift
# apart. No features of its own: the build's feature picks the backend.
i-slint-backend-winit = { version = "1.18", default-features = false }
# The system's own Open and Save dialogs: the XDG desktop portal on Linux
# (pure Rust, no GTK), the native dialogs on Windows and macOS. Its
# `wayland` feature comes with the Wayland build.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }

[dev-dependencies]
# The speed budget's 300-bar, 8-track score (src/speed.rs).
oxiguitar-testgen.workspace = true
# Our format plugins, built as .oxp files for the tests (src/test_support.rs).
oxiguitar-plugin-test.workspace = true

[build-dependencies]
slint-build = "1.18"

# The workspace's lints, except that unsafe code is denied rather than
# forbidden: the code Slint generates for ui/app.slint allows it locally,
# which "forbid" would refuse. Our own code still may not use unsafe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stderr = "allow"
