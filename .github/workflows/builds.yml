# Test builds for every target on each push to develop, kept 14 days under the
# Actions tab so testers can try them: the desktop app (oxiguitar) and the
# command-line tool (oxiguitar-cli). The packages (AppImage, .deb, .rpm,
# .dmg, .exe in a zip) are made by release.yml.
name: Test builds

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: "" }
          - { name: windows-x86_64, os: windows-2025, exe: ".exe" }
          - { name: windows-arm64, os: windows-11-arm, exe: ".exe" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli
      # Linux has two builds of the app (docs/design/plugins.md): oxiguitar
      # is the Wayland one, oxiguitar-x11 the deprecated X11 one.
      - if: runner.os == 'Linux'
        run: |
          cargo build --release --locked -p oxiguitar-app --no-default-features --features x11 --target-dir target/x11
          cp target/x11/release/oxiguitar target/release/oxiguitar-x11
      # Our plugins where the programs look for them: lib/oxiguitar/plugins/
      # beside bin's parent on Linux, plugins\ beside the .exe on Windows.
      - run: scripts/build-plugins.sh
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: oxiguitar-${{ matrix.name }}
          path: |
            target/release/oxiguitar${{ matrix.exe }}
            target/release/oxiguitar-x11
            target/release/oxiguitar-cli${{ matrix.exe }}
            target/lib/oxiguitar/plugins/*.oxp
            target/release/plugins/*.oxp
          retention-days: 14
          if-no-files-found: error
      # The test plugin (plugins/test, never shipped), apart, for trying
      # plugin tabs and events by hand: two tabs with every widget and a
      # canvas. Not beside the others, so a test build doesn't load it
      # unless the tester puts it in their plugin folder.
      - name: The test plugin
        shell: bash
        run: |
          cargo run --locked --release -p oxiguitar-plugin-test -- --build oxiguitar-test-plugin test --release
          mkdir -p test-plugin
          cp target/oxp/test.oxp test-plugin/
          cat > test-plugin/README.txt <<'TXT'
          The OxiGuitar test plugin: tabs "panel" (bottom area: every widget and
          a canvas) and "side" (right area), and every kind of event. Never
          shipped; for trying plugin tabs by hand.

          Put test.oxp in your plugin folder and start OxiGuitar:
            Linux    ~/.local/share/oxiguitar/plugins/
            Windows  %APPDATA%\OxiGuitar\plugins\
          Remove it, or untick it in Tools > Plugins, when done.
          TXT
      - uses: actions/upload-artifact@v4
        with:
          name: oxiguitar-test-plugin-${{ matrix.name }}
          path: test-plugin/
          retention-days: 14
          if-no-files-found: error
      # Files for checking the .gp writer in Guitar Pro (Mateus, with Guitar
      # Pro 7.6): every reference song and the test song in every format,
      # written as .gp by this build's plugin, with what each lost.
      - name: Files for Guitar Pro
        if: matrix.name == 'linux-x86_64'
        run: |
          mkdir -p guitar-pro-check
          {
            for f in fixtures/reference/*.gp; do
              target/release/oxiguitar-cli convert "$f" "guitar-pro-check/$(basename "$f")"
            done
            for f in fixtures/gp/oxiguitar-test-song.*; do
              target/release/oxiguitar-cli convert "$f" "guitar-pro-check/test-song-from-${f##*.}.gp"
            done
          } | tee guitar-pro-check/conversions.txt
      - if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: guitar-pro-check
          path: guitar-pro-check/
          retention-days: 14
          if-no-files-found: error

  macos:
    name: Build (macos-universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          mkdir -p dist/bin dist/PlugIns
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli --target "$target"
            scripts/build-plugins.sh --target "$target"
          done
          for bin in oxiguitar oxiguitar-cli; do
            lipo -create -output "dist/bin/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "dist/bin/$bin"
          done
          # Our plugins in PlugIns/ beside bin/, where the programs look
          # (<bin>/../PlugIns), each one universal file.
          for plugin in target/aarch64-apple-darwin/PlugIns/*.oxp; do
            name="$(basename "$plugin")"
            lipo -create -output "dist/PlugIns/$name" \
              "$plugin" "target/x86_64-apple-darwin/PlugIns/$name"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oxiguitar-macos-universal
          path: |
            dist/bin/oxiguitar
            dist/bin/oxiguitar-cli
            dist/PlugIns/*.oxp
          retention-days: 14
          if-no-files-found: error
