# Test builds for every target on each push to develop, kept 14 days under the
# Actions tab so testers can try them: the desktop app (oxiguitar) and the
# command-line tool (oxiguitar-cli). The packages (AppImage, .deb, .rpm,
# .dmg, .exe in a zip) are made by release.yml.
name: Test builds

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: "" }
          - { name: windows-x86_64, os: windows-2025, exe: ".exe" }
          - { name: windows-arm64, os: windows-11-arm, exe: ".exe" }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli
      - uses: actions/upload-artifact@v4
        with:
          name: oxiguitar-${{ matrix.name }}
          path: |
            target/release/oxiguitar${{ matrix.exe }}
            target/release/oxiguitar-cli${{ matrix.exe }}
          retention-days: 14
          if-no-files-found: error

  macos:
    name: Build (macos-universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          mkdir -p dist
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli --target "$target"
          done
          for bin in oxiguitar oxiguitar-cli; do
            lipo -create -output "dist/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
            lipo -info "dist/$bin"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: oxiguitar-macos-universal
          path: |
            dist/oxiguitar
            dist/oxiguitar-cli
          retention-days: 14
          if-no-files-found: error
