# Formatting, lint, tests, licence check, sign-off check and the no-network test.
# The final job, ci-success, passes only if every other job passed; branch rules
# require it before anything merges into develop or main.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Must match rust-version in Cargo.toml (Debian unstable's rustc).
  MSRV: "1.97"

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: Lint and docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Lints run on the minimum supported Rust, the same rustc and clippy
      # that Debian unstable ships, so CI and contributors' machines agree and
      # a new upstream lint cannot turn CI red overnight.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app (Slint, winit) needs these headers to build on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # Each problem also becomes an annotation on the pull request.
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features --locked \
            --message-format=short -- -D warnings 2>&1 \
            | sed -E 's/^([^ :]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::error file=\1,line=\2,col=\3::\5\n&/'
      - name: Docs
        run: |
          set -o pipefail
          cargo doc --workspace --no-deps --locked 2>&1 \
            | sed -E 's/^(error|warning)(\[[^]]*\])?: (.*)$/::error::\3\n&/'
        env:
          RUSTDOCFLAGS: -D warnings

  # Advisory only (not part of ci-success): shows what the next Rust
  # release's clippy will ask for, before Debian unstable ships it.
  lint-next:
    name: Lint on latest stable (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop app (Slint, winit) needs these headers to build on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - env:
          CARGO_TERM_COLOR: never
        run: |
          rustc --version
          if ! cargo clippy --workspace --all-targets --all-features --locked \
              --message-format=short -- -D warnings > clippy.log 2>&1; then
            sed -E 's/^([^ :]+):([0-9]+):([0-9]+): (error|warning): (.*)$/::warning file=\1,line=\2,col=\3::\5/;t;d' clippy.log
            # Anything without a file position (a crash, a lockfile problem):
            # show the end of the output as one annotation.
            echo "::warning title=clippy on $(rustc --version)::$(tail -n 25 clippy.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
            cat clippy.log
            exit 1
          fi

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-24.04, toolchain: stable }
          - { name: Linux x86_64 MSRV, os: ubuntu-24.04, toolchain: msrv }
          - { name: Linux ARM64, os: ubuntu-24.04-arm, toolchain: stable }
          - { name: Windows x86_64, os: windows-2025, toolchain: stable }
          - { name: Windows ARM64, os: windows-11-arm, toolchain: stable }
          - { name: macOS, os: macos-15, toolchain: stable }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain == 'msrv' && env.MSRV || matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.toolchain }}
      # The desktop app (Slint, winit) needs these headers to build on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # Failing tests also become an annotation, so they can be read without
      # downloading the job log. Bash on every runner, Windows included.
      - name: cargo test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --workspace --all-features --locked 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Each panic with the lines after it, then the "failures:" report,
            # or else the end of the output.
            report=$( (grep -E -A6 'panicked at|^error: test failed|signal: ' test.log; sed -n '/^failures:$/,/^test result:/p' test.log) | head -n 80)
            [ -n "$report" ] || report=$(tail -n 40 test.log)
            # Encoded with bash itself: macOS's BSD sed can't join lines.
            report=${report//'%'/'%25'}
            report=${report//$'\r'/'%0D'}
            report=${report//$'\n'/'%0A'}
            echo "::error title=cargo test (${{ matrix.name }})::$report"
          fi
          exit "$status"
      # A visual-regression failure leaves what was drawn and a picture of
      # the differences here (crates/oxiguitar-testgen/tests/visual.rs).
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff ${{ matrix.name }}
          path: target/tmp/visual-diff/
          if-no-files-found: ignore

  # M1's speed budget: a 300-bar, 8-track file opens in under a second, from
  # reading the file to the first tiles (crates/oxiguitar-app/src/speed.rs);
  # and M2's: 30 plugin manifests are read in under 10 ms at start
  # (crates/oxiguitar-plugin-test/tests/contract.rs).
  # Only optimised builds are held to it. Thin LTO and one codegen unit are
  # turned off to build faster; that makes the check a little stricter.
  speed:
    name: Speed budget
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: cargo test --release (speed budget)
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set +e
          cargo test --release --locked -p oxiguitar-app speed -- --nocapture 2>&1 | tee speed.log
          status=${PIPESTATUS[0]}
          cargo test --release --locked -p oxiguitar-plugin-test --test contract speed_budget -- --nocapture 2>&1 | tee -a speed.log
          [ "${PIPESTATUS[0]}" -eq 0 ] || status=1
          # The times as notices on the run, and a failure as an error.
          grep -E '^speed-budget' speed.log | while read -r line; do echo "::notice title=Speed budget::$line"; done
          if [ "$status" -ne 0 ]; then
            report=$(sed -n '/^failures:$/,/^test result:/p' speed.log | head -n 40)
            [ -n "$report" ] || report=$(tail -n 30 speed.log)
            echo "::error title=Speed budget::$(printf '%s' "$report" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
          fi
          exit "$status"

  deny:
    name: Licences and advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  no-network:
    name: No network (NET-5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace xvfb libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --workspace --locked
      - run: scripts/no-network.sh target/debug/oxiguitar-cli target/debug/oxiguitar

  dco:
    name: Sign-off (DCO)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: >-
          scripts/check-dco.sh
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  ci-success:
    name: ci-success
    if: always()
    needs: [fmt, lint, test, speed, deny, no-network, dco]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # 'skipped' is fine: the DCO job runs on pull requests only.
          if echo "$RESULTS" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
