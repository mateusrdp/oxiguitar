# Release packages: a portable .exe in a zip (Windows x86_64 and ARM64), a
# .deb and an .rpm of each Linux build (Wayland: oxiguitar; X11, deprecated:
# oxiguitar-x11), one AppImage holding both builds (x86_64 and ARM64 each),
# and a universal .dmg (macOS), none of them code-signed. Every download
# carries the basic plugins that work on its system (Mateus, 27 Oct 2026,
# replacing the separate plugin zips of 18 Oct): inside the zip, the .dmg
# and the AppImage, and as oxiguitar-plugins-basic, which the core .deb and
# .rpm depend on. Plugins are never attached one by one (Mateus, 21 Oct
# 2026); the release notes say which one file a user needs. The AppImages'
# programs and plugins are built on Ubuntu 22.04 (scripts/package/build-linux.sh)
# and go through the AppImage catalog's own test (job "AppImage catalog").
#
# - A pushed v* tag (only Mateus creates them) builds everything and attaches
#   it, with SHA256SUMS, to a draft release for him to check and publish.
# - Started by hand (Actions → Release packages → Run workflow), or on a pull
#   request that changes the packaging, it builds and tests the packages and
#   keeps them under the run for 14 days, with a ~dev version. Each package
#   is uploaded unzipped (archive: false), so it downloads as the .deb,
#   .rpm, .AppImage, .zip or .dmg itself.
#
# Every package is installed or opened and smoke-tested: the .deb in Debian
# sid, the .rpm in Fedora, the AppImage on the runner, the .exe's resources,
# the .dmg's bundle. Packaging scripts: scripts/package/.
name: Release packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package/**
      - scripts/build-plugins.sh
      - plugins/**
      - about.toml
      - assets/linux/**
      - assets/macos/**
      - assets/icon/**
      - crates/oxiguitar-app/build.rs
      - crates/oxiguitar-app/Cargo.toml
      - crates/oxiguitar-app/build/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_ABOUT_VERSION: 0.9.2
  # A public test file, opened by every smoke test.
  SAMPLE: fixtures/gp/oxiguitar-test-song.gp

jobs:
  meta:
    name: Version and licences
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          version="$(scripts/package/version.sh)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Package version: $version" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
      - id: about-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-about
          key: cargo-about-${{ env.CARGO_ABOUT_VERSION }}-${{ runner.os }}
      - if: steps.about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --version "$CARGO_ABOUT_VERSION" --features cli --locked
      - run: scripts/package/licenses.sh
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-licenses
          path: dist/THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpipewire-0.3-dev libclang-dev \
            rpm squashfs-tools xvfb xauth weston libxkbcommon-x11-0 libgl1-mesa-dri libegl1
      # The two Linux builds of the app (docs/design/plugins.md): the
      # Wayland one, the default, and the deprecated X11 one in a target
      # folder of its own.
      - run: cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli
      - run: cargo build --release --locked -p oxiguitar-app --no-default-features --features x11 --target-dir target/x11
      # Our plugins (target/lib/oxiguitar/plugins/), packaged apart from the
      # core: oxiguitar-plugins-basic and a zip.
      - run: scripts/build-plugins.sh
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: dist
      # The .deb and .rpm of each build; the AppImages come from the
      # "AppImage" job, built on Ubuntu 22.04.
      - run: scripts/package/linux.sh all "$VERSION" wayland
      - run: scripts/package/linux.sh all "$VERSION" x11
      - run: scripts/package/linux.sh plugins "$VERSION"
      # The core brings oxiguitar-plugins-basic along (it depends on it) and
      # opens the sample. Each build starts in its own kind of session: the
      # Wayland build in a headless Weston (scripts/package/in-wayland.sh),
      # the X11 build under Xvfb. Installing oxiguitar-x11 replaces oxiguitar
      # and keeps the plugins.
      - name: Test the .deb packages on Debian sid
        run: |
          docker run --rm -v "$PWD:/w" -w /w debian:sid bash -euxc '
            apt-get update
            # The databases first, so the package triggers rebuild them.
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              shared-mime-info desktop-file-utils appstream xvfb xauth weston libgl1-mesa-dri
            # Without the plugins the core cannot be installed.
            ! DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/oxiguitar_*.deb
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/oxiguitar_*.deb ./dist/oxiguitar-plugins-basic_*.deb
            dpkg -s oxiguitar | grep -E "^(Version|Depends|Recommends):"
            dpkg -s oxiguitar | grep -E "^Depends:.*oxiguitar-plugins-basic \(= "
            dpkg -s oxiguitar-plugins-basic | grep -E "^(Version|Depends|Enhances):"
            test "$(ls /usr/lib/oxiguitar/plugins/*.oxp | wc -l)" -eq 8
            oxiguitar-cli info "$0" > /dev/null
            grep -q "application/x-gtp:\*\.gp$" /usr/share/mime/globs2
            grep -q "application/x-gtp=io.github.mateusrdp.OxiGuitar.desktop" /usr/share/applications/mimeinfo.cache
            desktop-file-validate /usr/share/applications/io.github.mateusrdp.OxiGuitar.desktop
            appstreamcli validate --no-net /usr/share/metainfo/io.github.mateusrdp.OxiGuitar.metainfo.xml
            OXIGUITAR_EXIT_AFTER_MS=3000 scripts/package/in-wayland.sh oxiguitar "$0"
            # The X11 build takes its place.
            DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/oxiguitar-x11_*.deb
            ! dpkg -s oxiguitar 2> /dev/null | grep -q "^Status: install ok installed"
            dpkg -s oxiguitar-x11 | grep -E "^(Version|Depends|Recommends|Provides|Conflicts|Replaces):"
            test "$(ls /usr/lib/oxiguitar/plugins/*.oxp | wc -l)" -eq 8
            OXIGUITAR_EXIT_AFTER_MS=3000 xvfb-run -a oxiguitar "$0"
            apt-get remove -y oxiguitar-x11 oxiguitar-plugins-basic
            test ! -e /usr/lib/oxiguitar
          ' "$SAMPLE"
      # Debian's own package checker, from sid, on every .deb
      # (scripts/package/lintian.sh). Errors and warnings fail the release,
      # but for the two tags about the contact being the issue tracker
      # rather than an email (Mateus, 18 Oct 2026; scripts/package/linux.sh,
      # "maintainer").
      - name: Lintian
        run: |
          docker run --rm -e GITHUB_ACTIONS -v "$PWD:/w" -w /w debian:sid bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends lintian > /dev/null
            scripts/package/lintian.sh \
              --allow malformed-contact --allow bogus-mail-host-in-debian-changelog \
              dist/*.deb
          '
      - name: Test the .rpm packages on Fedora
        run: |
          docker run --rm -v "$PWD:/w" -w /w fedora:latest bash -euxc '
            dnf install -y shared-mime-info desktop-file-utils xorg-x11-server-Xvfb xorg-x11-xauth weston mesa-dri-drivers mesa-libEGL
            ! dnf install -y $(ls ./dist/oxiguitar-[0-9]*.rpm)
            dnf install -y $(ls ./dist/oxiguitar-[0-9]*.rpm) ./dist/oxiguitar-plugins-basic-*.rpm
            rpm -q --requires oxiguitar
            rpm -q --requires oxiguitar | grep -q "^oxiguitar-plugins-basic = "
            test "$(ls /usr/lib/oxiguitar/plugins/*.oxp | wc -l)" -eq 8
            oxiguitar-cli info "$0" > /dev/null
            grep -q "application/x-gtp:\*\.gp$" /usr/share/mime/globs2
            OXIGUITAR_EXIT_AFTER_MS=3000 scripts/package/in-wayland.sh oxiguitar "$0"
            dnf remove -y oxiguitar
            dnf install -y ./dist/oxiguitar-x11-*.rpm
            rpm -q --provides oxiguitar-x11 | grep -q "^oxiguitar = "
            test "$(ls /usr/lib/oxiguitar/plugins/*.oxp | wc -l)" -eq 8
            OXIGUITAR_EXIT_AFTER_MS=3000 xvfb-run -a oxiguitar "$0"
            dnf remove -y oxiguitar-x11 oxiguitar-plugins-basic
          ' "$SAMPLE"
      # With archive: false a step uploads exactly one file, so one step
      # per package; each pattern matches one (versions start with a digit).
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar_*.deb
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar-x11_*.deb
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar-[0-9]*.rpm
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar-x11-*.rpm
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar-plugins-basic_*.deb
          archive: false
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/oxiguitar-plugins-basic-*.rpm
          archive: false
          retention-days: 14
          if-no-files-found: error

  appimage:
    name: AppImage (${{ matrix.arch }})
    # The AppImages run on any Linux, so their programs and plugins are
    # built on Ubuntu 22.04, the oldest LTS in standard support, as the
    # AppImage catalog asks (scripts/package/build-linux.sh), and checked
    # to need no newer glibc. The PipeWire plugin can't be built there
    # (cpal 0.18's libspa needs newer PipeWire headers than 22.04's
    # 0.3.48), so an AppImage plays through ALSA, which PipeWire desktops
    # route to PipeWire (Mateus, 27 Oct 2026); the .deb and .rpm, built on
    # 24.04 above, keep it.
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-24.04 }
          - { arch: aarch64, os: ubuntu-24.04-arm }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools xvfb xauth weston libxkbcommon-x11-0 libgl1-mesa-dri libegl1
      # The registry and the build folders, kept between runs.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo-container/registry
            ~/.cargo-container/git
            target
          key: appimage-2204-${{ matrix.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: appimage-2204-${{ matrix.arch }}-
      - name: Build on Ubuntu 22.04
        run: |
          mkdir -p ~/.cargo-container
          docker run --rm -v "$PWD:/w" -w /w \
            -v "$HOME/.cargo-container:/opt/cargo-cache" \
            -e CARGO_HOME=/opt/cargo \
            ubuntu:22.04 bash -euc '
              mkdir -p /opt/cargo /opt/cargo-cache/registry /opt/cargo-cache/git
              ln -s /opt/cargo-cache/registry /opt/cargo/registry
              ln -s /opt/cargo-cache/git /opt/cargo/git
              scripts/package/build-linux.sh
            '
      # The catalog refuses anything needing a newer glibc than its test
      # system's, even a weak symbol (scripts/package/check-glibc.sh).
      - name: No glibc newer than 2.35
        run: |
          scripts/package/check-glibc.sh 2.35 \
            target/release/oxiguitar target/release/oxiguitar-cli \
            target/x11/release/oxiguitar target/lib/oxiguitar/plugins
          test ! -e target/lib/oxiguitar/plugins/audio-pipewire.oxp
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: dist
      - name: AppImage runtime
        run: |
          # The static type 2 runtime (needs no libfuse2 on the user's system).
          curl -fsSL -o "$RUNNER_TEMP/runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch }}"
          sha256sum "$RUNNER_TEMP/runtime"
          echo "APPIMAGE_RUNTIME=$RUNNER_TEMP/runtime" >> "$GITHUB_ENV"
      - run: scripts/package/linux.sh appimage "$VERSION"
      - name: Test the AppImage
        run: |
          # One AppImage holds both builds and the basic plugins: with an
          # empty user folder it opens the sample, as the Wayland build in a
          # Wayland session and as the X11 build on an X11 one (AppRun picks).
          appimage="$(ls dist/OxiGuitar-[0-9]*.AppImage)"
          home="$RUNNER_TEMP/empty-home"
          mkdir -p "$home"
          rm -rf "$RUNNER_TEMP/squashfs-root"
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract > /dev/null)
          root="$RUNNER_TEMP/squashfs-root"
          test -x "$root/AppRun"
          test -x "$root/usr/bin/oxiguitar"
          test -x "$root/usr/bin/oxiguitar-x11"
          # Our plugins but PipeWire's (see the job's comment).
          test "$(ls "$root"/usr/lib/oxiguitar/plugins/*.oxp | wc -l)" -eq 7
          test ! -e "$root/usr/lib/oxiguitar/plugins/audio-pipewire.oxp"
          test -f "$root/usr/share/metainfo/io.github.mateusrdp.OxiGuitar.metainfo.xml"
          scripts/package/check-glibc.sh 2.35 "$root"
          OXIGUITAR_HOME="$home" "$root/usr/bin/oxiguitar-cli" info "$SAMPLE" > /dev/null
          # Each build holds only its own display system's code
          # (scripts/check-display-crates.sh checks the crates; this, the files).
          ! grep -q "libX11.so" "$root/usr/bin/oxiguitar"
          ! grep -q "libwayland-client.so" "$root/usr/bin/oxiguitar-x11"
          # Without FUSE on the runner, the runtime unpacks and runs. AppRun
          # starts the Wayland build here (in-wayland.sh sets WAYLAND_DISPLAY)
          # and the X11 one under Xvfb, which sets only DISPLAY.
          OXIGUITAR_HOME="$home" APPIMAGE_EXTRACT_AND_RUN=1 OXIGUITAR_EXIT_AFTER_MS=3000 \
            scripts/package/in-wayland.sh "$appimage" "$SAMPLE"
          env -u WAYLAND_DISPLAY OXIGUITAR_HOME="$home" APPIMAGE_EXTRACT_AND_RUN=1 OXIGUITAR_EXIT_AFTER_MS=3000 \
            xvfb-run -a "$appimage" "$SAMPLE" 2> "$RUNNER_TEMP/x11.log" || { cat "$RUNNER_TEMP/x11.log"; exit 1; }
          cat "$RUNNER_TEMP/x11.log"
          ! grep -q "Wayland build" "$RUNNER_TEMP/x11.log"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OxiGuitar-[0-9]*.AppImage
          archive: false
          retention-days: 14
          if-no-files-found: error

  catalog:
    name: AppImage catalog
    # The AppImage catalog (appimage.github.io) tests every AppImage it lists
    # on the oldest Ubuntu LTS in standard support, under X11 only, without
    # network; this runs its own test on our x86_64 AppImage
    # (scripts/package/appimage-catalog-test.sh). It doesn't hold up a
    # draft release: their tools change apart from ours.
    needs: appimage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: "OxiGuitar-*-x86_64.AppImage"
          path: dist
          merge-multiple: true
          skip-decompress: true
      - run: scripts/package/appimage-catalog-test.sh dist/OxiGuitar-*-x86_64.AppImage
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-catalog
          path: catalog-result/
          retention-days: 14
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    needs: meta
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, os: windows-2025 }
          - { arch: arm64, os: windows-11-arm }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p oxiguitar-app -p oxiguitar-cli
      # Our plugins, in plugins\ beside the programs (target/release/plugins).
      - run: scripts/build-plugins.sh
        shell: bash
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: dist
      - name: Check the program's resources
        shell: pwsh
        run: |
          # The icon and version information are linked in by build.rs.
          $info = (Get-Item target/release/oxiguitar.exe).VersionInfo
          $info | Format-List FileDescription, ProductName, FileVersion, LegalCopyright
          if ($info.FileDescription -ne 'OxiGuitar') { throw 'oxiguitar.exe has no version information' }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path target/release/oxiguitar.exe))
          $bmp = $icon.ToBitmap()
          $c = $bmp.GetPixel([int]($bmp.Width / 2), [int]($bmp.Height / 2))
          "Icon $($bmp.Width)x$($bmp.Height), centre pixel $c"
          # The pick is green: the default program icon has no green centre.
          if ($c.G -le $c.R -or $c.G -le $c.B) { throw 'oxiguitar.exe does not carry the OxiGuitar icon' }
          ./target/release/oxiguitar-cli.exe info $env:SAMPLE | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'oxiguitar-cli failed' }
      - name: Package
        shell: pwsh
        run: |
          # The programs with the basic plugins in plugins\ beside them, the
          # folder they search (Mateus, 27 Oct 2026: every download carries
          # the plugins that work on its system).
          $name = "OxiGuitar-$env:VERSION-windows-${{ matrix.arch }}"
          $dir = "dist/$name"
          New-Item -ItemType Directory -Force $dir, "$dir/licenses", "$dir/plugins" | Out-Null
          Copy-Item target/release/oxiguitar.exe, target/release/oxiguitar-cli.exe $dir
          Copy-Item README.md, CHANGELOG.md, CREDITS.md $dir
          Copy-Item LICENSE "$dir/LICENSE.txt"
          Copy-Item dist/THIRD-PARTY-LICENSES.html "$dir/licenses/"
          Copy-Item assets/fonts/bravura/OFL.txt "$dir/licenses/Bravura-OFL.txt"
          Copy-Item assets/fonts/noto-sans/OFL.txt "$dir/licenses/NotoSans-OFL.txt"
          $plugins = Get-ChildItem target/release/plugins/*.oxp
          if ($plugins.Count -ne 7) { throw 'expected our seven plugins' }
          Copy-Item $plugins "$dir/plugins"
          Compress-Archive -Path $dir -DestinationPath "dist/$name.zip"
          Get-Item "dist/$name.zip"
      - name: Test the zip
        shell: pwsh
        run: |
          # Unzipped anywhere, with an empty user folder, it opens the sample.
          $t = "$env:RUNNER_TEMP/zip-test"
          Expand-Archive "dist/OxiGuitar-$env:VERSION-windows-${{ matrix.arch }}.zip" $t
          $core = Get-ChildItem $t -Directory | Select-Object -First 1
          if ((Get-ChildItem "$($core.FullName)/plugins/*.oxp").Count -ne 7) { throw 'the zip lacks our seven plugins' }
          $env:OXIGUITAR_HOME = "$env:RUNNER_TEMP/empty-home"
          & "$($core.FullName)/oxiguitar-cli.exe" info $env:SAMPLE | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'the zip opened nothing' }
      - uses: actions/upload-artifact@v7
        with:
          path: dist/OxiGuitar-[0-9]*-windows-*.zip
          archive: false
          retention-days: 14
          if-no-files-found: error

  macos:
    name: macOS (universal)
    needs: meta
    runs-on: macos-15
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked -p oxiguitar-app --target "$target"
          done
          # The command-line tool, for testing the app's plugins below.
          cargo build --release --locked -p oxiguitar-cli --target aarch64-apple-darwin
          mkdir -p dist/macos
          lipo -create -output dist/macos/oxiguitar \
            target/aarch64-apple-darwin/release/oxiguitar \
            target/x86_64-apple-darwin/release/oxiguitar
          lipo -info dist/macos/oxiguitar
      # Our plugins, each one universal file, in the app's Contents/PlugIns.
      - run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            scripts/build-plugins.sh --target "$target"
          done
          mkdir -p dist/macos/PlugIns
          for plugin in target/aarch64-apple-darwin/PlugIns/*.oxp; do
            name="$(basename "$plugin")"
            lipo -create -output "dist/macos/PlugIns/$name" \
              "$plugin" "target/x86_64-apple-darwin/PlugIns/$name"
            lipo -info "dist/macos/PlugIns/$name"
          done
      - uses: actions/download-artifact@v8
        with:
          name: third-party-licenses
          path: dist
      - run: scripts/package/macos.sh "$VERSION"
      - name: Test the .dmg
        run: |
          mount="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" dist/OxiGuitar-*.dmg
          app="$mount/OxiGuitar.app"
          plutil -p "$app/Contents/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|gp5"
          lipo -info "$app/Contents/MacOS/oxiguitar" | grep -q "x86_64 arm64"
          test -f "$app/Contents/Resources/OxiGuitar.icns"
          codesign --verify --verbose "$app"
          # The app holds our seven plugins, universal and signed, where it
          # searches (Contents/PlugIns). The command-line tool, copied into
          # a bundle of the same shape, opens the sample through them with
          # an empty user folder.
          test "$(ls "$app"/Contents/PlugIns/*.oxp | wc -l)" -eq 7
          for plugin in "$app"/Contents/PlugIns/*.oxp; do
            lipo -info "$plugin" | grep -q "x86_64 arm64"
            codesign --verify "$plugin"
          done
          shape="$RUNNER_TEMP/cli/Contents"
          mkdir -p "$shape/MacOS" "$RUNNER_TEMP/empty-home"
          cp target/aarch64-apple-darwin/release/oxiguitar-cli "$shape/MacOS/"
          cp -R "$app/Contents/PlugIns" "$shape/PlugIns"
          OXIGUITAR_HOME="$RUNNER_TEMP/empty-home" "$shape/MacOS/oxiguitar-cli" info "$SAMPLE" > /dev/null
          hdiutil detach "$mount"
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.dmg
          archive: false
          retention-days: 14
          if-no-files-found: error

  release:
    name: Draft release
    # Collecting the packages and their checksums runs on every build, so a
    # build by hand tests it before a tag relies on it; only a v* tag goes on
    # to create the draft release.
    needs: [meta, linux, appimage, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          # Package artifacts are named after their files and uploaded
          # unzipped (archive: false). skip-decompress keeps them as they
          # are: without it the action unpacks anything that is a zip, so
          # the Windows .zip packages arrived as folders (v0.1.0's first
          # tag build, 18 Oct 2026).
          pattern: "*.{deb,rpm,AppImage,zip,dmg}"
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Check the packages
        run: |
          # Each kind of file, by name. For each Linux architecture: a .deb
          # and an .rpm of each build of the core (Wayland, X11), the basic
          # plugins' .deb and .rpm they depend on, and one AppImage holding
          # both builds and the plugins. A zip for each Windows architecture
          # and the universal .dmg, each with the plugins inside. No plugin
          # on its own, and no zip of plugins (Mateus, 27 Oct 2026).
          find dist -mindepth 1 -maxdepth 1 -printf '%y %s %f\n' | sort -k3
          if find dist -mindepth 1 -maxdepth 1 ! -type f | grep -q .; then
            echo "::error::dist/ holds something that is not a file" >&2
            exit 1
          fi
          expect() { # expect COUNT PATTERN WHAT
            local n
            n="$(find dist -mindepth 1 -maxdepth 1 -type f -name "$2" | wc -l)"
            if [ "$n" -ne "$1" ]; then
              echo "::error::expected $1 $3 ($2), found $n" >&2
              exit 1
            fi
          }
          expect 2 'oxiguitar_*.deb' 'Wayland core .deb'
          expect 2 'oxiguitar-x11_*.deb' 'X11 core .deb'
          expect 2 'oxiguitar-plugins-basic_*.deb' 'plugin .deb'
          expect 2 'oxiguitar-[0-9]*.rpm' 'Wayland core .rpm'
          expect 2 'oxiguitar-x11-*.rpm' 'X11 core .rpm'
          expect 2 'oxiguitar-plugins-basic-*.rpm' 'plugin .rpm'
          expect 2 'OxiGuitar-[0-9]*.AppImage' 'AppImage'
          expect 0 'OxiGuitar-x11-*.AppImage' 'X11 AppImage (the AppImage holds both builds)'
          expect 2 'OxiGuitar-[0-9]*-windows-*.zip' 'Windows zip'
          expect 1 '*.dmg' '.dmg'
          expect 0 'OxiGuitar-plugins-basic-*.zip' 'plugin zip'
          expect 0 '*.oxp' 'plugin on its own'
          expect 17 '*' 'files in all'
          for f in dist/OxiGuitar-[0-9]*-windows-*.zip; do
            unzip -tq "$f" > /dev/null || { echo "::error::$f is not a valid zip" >&2; exit 1; }
            unzip -l "$f" | grep -q 'oxiguitar.exe' || { echo "::error::$f has no oxiguitar.exe" >&2; exit 1; }
            # Five format plugins, the SoundFont instrument and WASAPI.
            [ "$(unzip -l "$f" | grep -cE 'plugins[/\\][^/\\]*\.oxp$')" -eq 7 ] || { echo "::error::$f lacks our seven plugins in plugins/" >&2; exit 1; }
          done
      - name: Checksums
        run: (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          # Which files to take (scripts/package/release-notes.md), then the
          # version's section of CHANGELOG.md, without its heading.
          sed "s/@VERSION@/$VERSION/g" scripts/package/release-notes.md > notes.md
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no section \"## [$VERSION]\"" >&2
            exit 1
          fi
          cat changes.md >> notes.md
          # The software centres' list of releases names this one first.
          newest="$(grep -m 1 -oP '<release version="\K[^"]+' assets/linux/io.github.mateusrdp.OxiGuitar.metainfo.xml)"
          if [ "$newest" != "$VERSION" ]; then
            echo "::error::the metainfo's newest release is $newest, not $VERSION: add a <release> for it (assets/linux/io.github.mateusrdp.OxiGuitar.metainfo.xml)" >&2
            exit 1
          fi
      - name: Create the draft release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --verify-tag \
            --title "OxiGuitar $VERSION" \
            --notes-file notes.md
