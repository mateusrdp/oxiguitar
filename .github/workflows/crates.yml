# The crates plugin authors build with, on crates.io (Mateus, 19 Oct 2026):
# oxiguitar-plugin-api (the interface), oxiguitar-plugin (the SDK),
# oxiguitar-host (the plugin host) and oxiguitar-plugin-test (the contract
# suite), in that order, each depending on the ones before.
#
# - On pull requests that touch them, and by hand: package and verify all
#   four together (cargo package builds each from its .crate, against the
#   others' packages), so a release can't fail on them.
# - When Mateus publishes a GitHub release (the draft a v* tag made): the
#   same, then publish each crate at the release's version, skipping any
#   already on crates.io at that version (a re-run). Needs the repository
#   secret CARGO_REGISTRY_TOKEN (a crates.io API token with the
#   publish-new and publish-update scopes).
name: Crates

on:
  release:
    types: [published]
  pull_request:
    paths:
      - crates/oxiguitar-plugin-api/**
      - crates/oxiguitar-plugin/**
      - crates/oxiguitar-host/**
      - crates/oxiguitar-plugin-test/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/crates.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CRATES: oxiguitar-plugin-api oxiguitar-plugin oxiguitar-host oxiguitar-plugin-test

jobs:
  crates:
    name: Package${{ github.event_name == 'release' && ' and publish' || '' }} the plugin crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Package and verify
        run: |
          args=()
          for c in $CRATES; do args+=(-p "$c"); done
          cargo package --locked "${args[@]}"
          ls -l target/package/*.crate
      - name: Publish
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"
            exit 1
          fi
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "oxiguitar-plugin") | .version')"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::the release is $TAG, but the crates are version $version"
            exit 1
          fi
          for c in $CRATES; do
            if curl -fsS -A "oxiguitar release (github.com/mateusrdp/oxiguitar)" \
                "https://crates.io/api/v1/crates/$c/$version" > /dev/null 2>&1; then
              echo "$c $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$c"
            echo "::notice::published $c $version"
          done
