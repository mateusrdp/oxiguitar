# The user manual (docs/manual/, mdBook) on GitHub Pages.
#
# - On pull requests that touch the manual: build it, so broken links and
#   missing pages show up before the merge.
# - On pushes to develop that touch it, and by hand: build it and publish it
#   to https://mateusrdp.github.io/oxiguitar/.
#
# Pages must use "GitHub Actions" as its source (Settings → Pages).
name: Manual

on:
  push:
    branches: [develop]
    paths: [docs/manual/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/manual/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build the manual
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          file="mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/$file"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build docs/manual
      - name: Check internal links
        # mdBook only warns about a link to a missing page; fail instead.
        run: |
          cd docs/manual/book
          missing=0
          for page in $(find . -name '*.html'); do
            for target in $(grep -o 'href="[^"#:]*\.html' "$page" | sed 's/^href="//'); do
              if [ ! -f "$(dirname "$page")/$target" ]; then
                echo "::error::$page links to missing page $target"
                missing=1
              fi
            done
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/manual/book

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
