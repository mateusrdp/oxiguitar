# The user manual (docs/manual/) and the plugin developer guide (docs/plugins/),
# both mdBook, on GitHub Pages.
#
# - On pull requests that touch either: build them, so broken links, missing
#   pages and examples missing from the template show up before the merge.
# - On pushes to main that touch them (so they describe the released program),
#   and by hand: build them and publish the manual to
#   https://mateusrdp.github.io/oxiguitar/ and the guide to
#   https://mateusrdp.github.io/oxiguitar/plugins/.
#
# Pages must use "GitHub Actions" as its source (Settings → Pages), and the
# github-pages environment must allow main (Settings → Environments).
# Rulesets don't count as "protected branches" there, so main is listed by
# name.
name: Manual

on:
  push:
    branches: [main]
    paths: [docs/manual/**, docs/plugins/**, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/manual/**, docs/plugins/**, .github/workflows/docs.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: v0.5.4
  MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7

jobs:
  build:
    name: Build the manual and the guide
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install mdBook
        run: |
          file="mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$file" \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/$file"
          echo "$MDBOOK_SHA256  $RUNNER_TEMP/$file" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Build
        # mdBook only warns about an example it can't include (a file or an
        # anchor missing from the template); fail instead.
        run: |
          set -o pipefail
          for book in docs/manual docs/plugins; do
            mdbook build "$book" 2>&1 | tee "$RUNNER_TEMP/mdbook.log"
            if grep -E "WARN|ERROR" "$RUNNER_TEMP/mdbook.log"; then
              echo "::error::mdbook build $book warned"
              exit 1
            fi
          done
          # The guide is published under the manual, at /plugins/.
          cp -R docs/plugins/book docs/manual/book/plugins
      - name: Check internal links
        # mdBook only warns about a link to a missing page; fail instead.
        run: |
          cd docs/manual/book
          missing=0
          while IFS= read -r -d '' page; do
            while IFS= read -r target; do
              if [ ! -f "$(dirname "$page")/$target" ]; then
                echo "::error::$page links to missing page $target"
                missing=1
              fi
            done < <(grep -o 'href="[^"#:]*\.html' "$page" | sed 's/^href="//')
          done < <(find . -name '*.html' -print0)
          exit $missing
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/manual/book

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
