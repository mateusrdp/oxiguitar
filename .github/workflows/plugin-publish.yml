# Publishes a plugin release (#165), called from the plugin repository's
# own workflow on `release: published`:
#
#   on:
#     release:
#       types: [published]
#   jobs:
#     publish:
#       uses: mateusrdp/oxiguitar/.github/workflows/plugin-publish.yml@v0.11.0
#       with:
#         name: midi
#         tools-ref: v0.11.0
#       secrets: inherit
#
# Publishing the draft that plugin-release.yml made (Mateus does) is the one
# act that updates what people install from: this workflow first checks the
# release holds every file and sum, then tells the package repositories.
#
# - mateusrdp/oxiguitar-packages (the apt and dnf repositories, and the
#   Flatpak extensions) and mateusrdp/homebrew-oxiguitar (the tap) get a
#   repository_dispatch event `plugin-published` with the plugin, the tag
#   and the repository, and fetch the files from the release themselves.
#   It needs the secret PACKAGES_TOKEN, a token of Mateus's that can
#   dispatch to those two repositories (contents: write). Without it
#   nothing is sent and the run says so.
# - winget (when winget-id is given): wingetcreate opens a pull request on
#   microsoft/winget-pkgs with the two installers' addresses and sums. It needs the secret WINGET_TOKEN
#   (public_repo) and a fork of winget-pkgs; the first submission of each
#   package is reviewed by hand at Microsoft. Without it, nothing is sent.
#
# Nothing here uploads anywhere else, and the plugins themselves never
# download or upload anything.
name: Plugin publish

on:
  workflow_call:
    inputs:
      name:
        description: "The plugin's file name without .oxp, such as midi"
        type: string
        required: true
      tag:
        description: "The release's tag (default: the release that started the run)"
        type: string
        default: ""
      systems:
        description: "The systems the plugin is built for, as in plugin-release.yml"
        type: string
        default: "linux windows macos"
      tools-ref:
        description: "The tag (or commit) of mateusrdp/oxiguitar the scripts come from"
        type: string
        required: true
      packages-repository:
        type: string
        default: mateusrdp/oxiguitar-packages
      tap-repository:
        type: string
        default: mateusrdp/homebrew-oxiguitar
      winget-id:
        description: "The winget package id, such as mateusrdp.OxiGuitar.MIDI; empty skips winget"
        type: string
        default: ""
    secrets:
      PACKAGES_TOKEN:
        required: false
      WINGET_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Check and tell
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: mateusrdp/oxiguitar
          ref: ${{ inputs.tools-ref }}
          path: tools
          sparse-checkout: scripts/plugin-package
      - name: Fetch the release's files
        run: |
          test -n "$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
      - name: Check every file and sum is there
        env:
          PLUGIN_SYSTEMS: ${{ inputs.systems }}
        run: tools/scripts/plugin-package/check-assets.sh '${{ inputs.name }}' "${TAG#v}" release
      - name: Tell the package repositories
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [[ -z "$PACKAGES_TOKEN" ]]; then
            echo "::notice::PACKAGES_TOKEN isn't set: the package repositories were not told about $TAG."
            exit 0
          fi
          payload="$(jq -nc --arg plugin '${{ inputs.name }}' --arg tag "$TAG" --arg repo "$GITHUB_REPOSITORY" \
            '{event_type: "plugin-published", client_payload: {plugin: $plugin, tag: $tag, repository: $repo}}')"
          for target in '${{ inputs.packages-repository }}' '${{ inputs.tap-repository }}'; do
            GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/$target/dispatches" --method POST --input - <<< "$payload"
            echo "Told $target."
          done

  winget:
    name: Submit to winget
    # The first submission of a package is made by hand with `wingetcreate
    # new` and reviewed at Microsoft; winget-id stays empty until it is in.
    if: inputs.winget-id != ''
    needs: publish
    runs-on: windows-2025
    env:
      TAG: ${{ inputs.tag != '' && inputs.tag || github.event.release.tag_name }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Open the pull request on winget-pkgs
        run: |
          if [[ -z "$WINGET_TOKEN" ]]; then
            echo "::notice::WINGET_TOKEN isn't set: winget was not told about $TAG."
            exit 0
          fi
          version="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/oxiguitar-${{ inputs.name }}-$version-windows"
          curl -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          ./wingetcreate.exe update '${{ inputs.winget-id }}' --version "$version" \
            --urls "$base-x86_64-setup.exe|x64" "$base-arm64-setup.exe|arm64" \
            --token "$WINGET_TOKEN" --submit
