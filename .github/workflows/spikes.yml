# Builds the GUI-toolkit spikes (spikes/gui, ADR 0004) on every target with the
# minimum supported Rust, to show which toolkits build where; and runs the
# audio spikes (spikes/audio, spikes/nam-bench; M4) on every target, printing
# their measurements as notices and in the job summary. Advisory only:
# not part of ci-success, so a spike can never block a merge. The Linux x86_64
# binaries are kept for 14 days under the Actions tab so they can be tried
# without building.
name: Spikes

on:
  pull_request:
    paths:
      - "spikes/**"
      - "crates/oxiguitar-display/**"
      - "crates/oxiguitar-render/**"
      - ".github/workflows/spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spikes-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match rust-version in Cargo.toml (Debian unstable's rustc).
  MSRV: "1.97"

jobs:
  gui:
    name: GUI spikes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: "" }
          - { name: windows-x86_64, os: windows-2025, exe: ".exe" }
          - { name: windows-arm64, os: windows-11-arm, exe: ".exe" }
          - { name: macos-arm64, os: macos-15, exe: "" }
    defaults:
      run:
        shell: bash
        working-directory: spikes/gui
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/gui
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build each toolkit
        run: |
          echo "| Spike | Result | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for t in slint iced egui; do
            if cargo build --release --locked -p "spike-$t"; then
              size=$(wc -c < "target/release/spike-$t${{ matrix.exe }}")
              echo "| $t | built | $((size / 1048576)) MB |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $t | **failed** | |" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit $failed
      - name: Test the shared spike code
        run: cargo test --release --locked -p spike-common
      - if: matrix.name == 'linux-x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: gui-spikes-linux-x86_64
          path: |
            spikes/gui/target/release/spike-slint
            spikes/gui/target/release/spike-iced
            spikes/gui/target/release/spike-egui
          retention-days: 14
          if-no-files-found: error

  audio:
    name: Audio spikes (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, exe: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, exe: "" }
          - { name: windows-x86_64, os: windows-2025, exe: ".exe" }
          - { name: windows-arm64, os: windows-11-arm, exe: ".exe" }
          - { name: macos-arm64, os: macos-15, exe: "" }
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
      # NeuralAmpModelerCore's example models (MIT), at a fixed commit.
      NAM_MODELS: https://raw.githubusercontent.com/sdatkinson/NeuralAmpModelerCore/0b3d3c97b0859a3a8c92a8628c4dd89a25eb5842/example_models
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
      - name: Set up
        run: |
          # run TITLE COMMAND...: each line the command prints becomes a
          # notice (GitHub keeps at most ten a step, so steps stay small); a
          # failure becomes an error with the output's last lines, and the
          # job goes on (CI logs can't be read from Claude's sessions).
          # quiet TITLE COMMAND...: the same, silent when it works (builds).
          cat > "$RUNNER_TEMP/run.sh" <<'SH'
          title="$1"; shift
          if out="$("$@" 2>&1)"; then
            [ "$QUIET" = 1 ] && exit 0
            printf '%s\n' "$out" | grep -v '^ *$' | grep -v '^ALSA lib' | while IFS= read -r line; do
              echo "::notice title=$title::$line"
              echo "- **$title**: $line" >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "::error title=$title::$(printf '%s' "$out" | grep -v '^ *Compiling\|^ *Downloaded\|^ *Downloading\|^ *Updating' | tail -n 12 | tr '\n' ' ' | cut -c1-1500)"
          fi
          SH
          chmod +x "$RUNNER_TEMP/run.sh"
          case "${{ runner.os }}" in
            Linux) cpu="$(lscpu | sed -n 's/^Model name: *//p' | head -n1)" ;;
            macOS) cpu="$(sysctl -n machdep.cpu.brand_string)" ;;
            Windows) cpu="$(powershell -NoProfile -Command '(Get-CimInstance Win32_Processor).Name')" ;;
          esac
          echo "::notice title=CPU (${{ matrix.name }})::$cpu"
          echo "**${{ matrix.name }}**: $cpu" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/nam"
          for m in wavenet_a1_standard lstm; do
            curl -fsSL -o "$RUNNER_TEMP/nam/$m.nam" "$NAM_MODELS/$m.nam"
          done
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluid-soundfont-gm musescore-general-soundfont-small libasound2-dev libpipewire-0.3-dev libclang-dev
      - name: Build
        run: |
          QUIET=1 "$RUNNER_TEMP/run.sh" "Build audio spike (${{ matrix.name }})" cargo build --release --manifest-path spikes/audio/Cargo.toml
          QUIET=1 "$RUNNER_TEMP/run.sh" "Build nam-bench (${{ matrix.name }})" cargo build --release --manifest-path spikes/nam-bench/Cargo.toml
          if [ "${{ runner.os }}" = Linux ]; then
            QUIET=1 "$RUNNER_TEMP/run.sh" "Build cpal with ALSA and PipeWire (${{ matrix.name }})" cargo build --release --manifest-path spikes/audio/Cargo.toml --features devices
          fi
      - name: The sound set the system ships
        if: runner.os != 'Linux'
        run: |
          if [ "${{ runner.os }}" = Windows ]; then f="C:/Windows/System32/drivers/gm.dls"; else f="/System/Library/Components/CoreAudio.component/Contents/Resources/gs_instruments.dls"; fi
          "$RUNNER_TEMP/run.sh" "Sound set (${{ matrix.name }})" "spikes/audio/target/release/audio-spike${{ matrix.exe }}" dls "$f"
      - name: SoundFont synthesisers
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/aud"
          for sf in /usr/share/sounds/sf2/FluidR3_GM.sf2 /usr/share/sounds/sf3/MuseScore_General_Lite.sf3; do
            for e in rusty/64 rusty/8 oxi; do
              "$RUNNER_TEMP/run.sh" "Synth (${{ matrix.name }})" spikes/audio/target/release/audio-spike render "$e" "$sf" "$RUNNER_TEMP/aud/x.wav"
            done
          done
      - name: Timing and the whole chain
        if: runner.os == 'Linux'
        run: |
          for e in rusty/64 rusty/8 oxi; do
            "$RUNNER_TEMP/run.sh" "Timing (${{ matrix.name }})" spikes/audio/target/release/audio-spike timing "$e" /usr/share/sounds/sf2/FluidR3_GM.sf2
          done
          for m in wavenet_a1_standard lstm; do
            "$RUNNER_TEMP/run.sh" "Pipeline $m (${{ matrix.name }})" spikes/audio/target/release/audio-spike pipeline /usr/share/sounds/sf2/FluidR3_GM.sf2 "$RUNNER_TEMP/nam/$m.nam" "$RUNNER_TEMP/aud/p.wav"
          done
      - name: NAM with nam-rs
        run: |
          for m in wavenet_a1_standard lstm; do
            "$RUNNER_TEMP/run.sh" "NAM $m (${{ matrix.name }})" "spikes/nam-bench/target/release/nam-bench${{ matrix.exe }}" "$RUNNER_TEMP/nam/$m.nam"
          done
      - name: NAM with NeuralAmpModeler-rs too
        # Linux x86_64 only: it needs Rust 1.99, the x86-64-v3 baseline, and
        # Linux's libc (it doesn't build on Windows).
        if: matrix.name == 'linux-x86_64'
        run: |
          rustup toolchain install 1.99.0 --profile minimal > /dev/null
          RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_TARGET_DIR=spikes/nam-bench/target/nam2 QUIET=1 "$RUNNER_TEMP/run.sh" "Build NeuralAmpModeler-rs" cargo +1.99.0 build --release --features nam2 --manifest-path spikes/nam-bench/Cargo.toml
          for m in wavenet_a1_standard lstm; do
            "$RUNNER_TEMP/run.sh" "NAM both $m (${{ matrix.name }})" spikes/nam-bench/target/nam2/release/nam-bench "$RUNNER_TEMP/nam/$m.nam"
          done
