# Tells the package repositories when the maintainer
# publishes a release, as each plugin's publish workflow does: publishing the
# draft is the one act that updates what people install. It checks the
# release's files against its SHA256SUMS, then sends the event
# `plugin-published` (the name every repository listens for) to
# mateusrdp/oxiguitar-packages, which rebuilds the signed apt and dnf
# repositories from the latest published releases. (A Homebrew tap used to be
# told too; it was dropped on 4 Nov 2026, as Homebrew no longer supports Intel
# Macs.)
#
# It needs the secret PACKAGES_TOKEN, a token that can dispatch to that
# repository (the plugins' publish workflows use the same one); without it
# nothing is sent and the run says so.
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.13.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Check and tell
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: The release holds every file in its sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release
          cd release
          test -s SHA256SUMS || { echo "::error::$TAG has no SHA256SUMS"; exit 1; }
          sha256sum -c SHA256SUMS
          v="${TAG#v}"
          for f in "oxiguitar_${v}_amd64.deb" "oxiguitar-${v}-1.x86_64.rpm" "OxiGuitar-${v}-macos-universal.dmg"; do
            test -f "$f" || { echo "::error::$TAG lacks $f"; exit 1; }
          done
      - name: Tell the package repositories and the tap
        env:
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          if [[ -z "$PACKAGES_TOKEN" ]]; then
            echo "::notice::PACKAGES_TOKEN isn't set: the package repositories were not told about $TAG."
            exit 0
          fi
          payload="$(jq -nc --arg tag "$TAG" --arg repo "$GITHUB_REPOSITORY" \
            '{event_type: "plugin-published", client_payload: {plugin: "oxiguitar", tag: $tag, repository: $repo}}')"
          for target in mateusrdp/oxiguitar-packages; do
            GH_TOKEN="$PACKAGES_TOKEN" gh api "repos/$target/dispatches" --method POST --input - <<< "$payload"
            echo "Told $target."
          done
