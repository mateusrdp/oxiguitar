[package]
name = "oxiguitar-gp5-plugin"
description = "The OxiGuitar format plugin for Guitar Pro 5: reads Guitar Pro 5 files (.gp5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# An ordinary library for tests, and gp5.oxp when built with
# `--features oxp --crate-type cdylib` (scripts/build-plugins.sh,
# oxiguitar-plugin-test).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
oxiguitar-plugin.workspace = true
# Only this plugin's reader (docs/design/plugins.md: each plugin carries
# only its own code).
oxiguitar-formats = { path = "../../crates/oxiguitar-formats", default-features = false, features = ["gp5", "plugin"] }

[dev-dependencies]
serde_json.workspace = true

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
