[package]
name = "oxiguitar-wav-plugin"
description = "The OxiGuitar WAV plugin: File → Export → WAV Audio, the score's sound as a WAV file, 16- or 24-bit or 32-bit float, at 44.1 or 48 kHz."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# An ordinary library for tests, and wav.oxp when built with
# `--features oxp --crate-type cdylib` (scripts/build-plugins.sh).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
oxiguitar-plugin.workspace = true

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
