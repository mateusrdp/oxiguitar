[package]
name = "oxiguitar-audio-pipewire-plugin"
description = "The OxiGuitar audio-device plugin for PipeWire: plays OxiGuitar's sound through PipeWire."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
# An ordinary library for tests, and audio-pipewire.oxp when built with
# `--features oxp --crate-type cdylib` (scripts/build-plugins.sh, which
# builds it only for linux, as its manifest's conditions say).
crate-type = ["lib"]

[features]
oxp = []

[dependencies]
oxiguitar-plugin.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
oxiguitar-audio-cpal = { path = "../../crates/oxiguitar-audio-cpal" }
# cpal with its PipeWire host (libpipewire-0.3), which only this plugin builds.
cpal = { version = "0.18", default-features = false, features = ["pipewire"] }

[dev-dependencies]
serde_json.workspace = true

# Plugins deny `unsafe` rather than forbid it: `export_plugin!` allows it on
# the two attributes it generates, and nowhere else.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
