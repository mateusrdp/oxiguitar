# Builds the plugin for every system OxiGuitar runs on, tests it there, and
# attaches the files to a GitHub release when a tag v* is pushed
# (docs/plugins, "Build for every system").
#
# build-oxp.sh names each file NAME-VERSION-SYSTEM-ARCH.oxp; users drop it in a
# plugin folder as it is. macOS gets one universal file for Intel and Apple
# Silicon.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The plugin's file name, without .oxp (as in build-oxp.sh).
  NAME: example

jobs:
  build:
    name: ${{ matrix.system }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu LTS in standard support, as OxiGuitar's own
          # packages: a plugin built there loads on every newer system.
          - { system: linux, arch: x86_64, os: ubuntu-22.04 }
          - { system: linux, arch: aarch64, os: ubuntu-22.04-arm }
          - { system: windows, arch: x86_64, os: windows-2025 }
          - { system: windows, arch: arm64, os: windows-11-arm }
          - { system: macos, arch: universal, os: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.system == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # The unit tests and tests/contract.rs, which builds the .oxp file and
      # runs OxiGuitar's contract suite on it.
      - run: cargo test
      # dist/NAME-VERSION-SYSTEM-ARCH.oxp; on macOS one universal file.
      - run: ./build-oxp.sh
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}-${{ matrix.system }}-${{ matrix.arch }}
          path: dist/*.oxp

  release:
    name: Attach to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with every file and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum *.oxp > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes "Put the file for your system in OxiGuitar's plugin folder." \
            *.oxp SHA256SUMS
