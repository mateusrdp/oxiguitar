# The OxiGuitar user manual, built with mdBook and published to GitHub Pages
# by .github/workflows/docs.yml. Build it locally with: mdbook build docs/manual
# (the pages land in docs/manual/book/, which git ignores).

[book]
title = "OxiGuitar manual"
authors = ["Mateus Rocha de Paula", "The OxiGuitar contributors"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/mateusrdp/oxiguitar"
edit-url-template = "https://github.com/mateusrdp/oxiguitar/edit/develop/docs/manual/{path}"
default-theme = "light"
preferred-dark-theme = "navy"
no-section-label = true

[output.html.search]
enable = true
