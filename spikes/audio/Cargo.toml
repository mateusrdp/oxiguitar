[package]
name = "audio-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[workspace]

[dependencies]
rustysynth = "1.3.8"
nam-rs = "0.4.0"
lewton = "0.10.2"
oxisynth = { version = "0.1.0", features = ["sf3"] }
hound = "3.5.1"
midly = "0.5.3"
cpal = { version = "0.18.2", optional = true }

# The listening renders (src/amp.rs): x86_64 only, Rust 1.99 or newer and
# RUSTFLAGS="-C target-cpu=x86-64-v3".
NeuralAmpModeler-rs = { version = "1.0.1", default-features = false, optional = true }

[features]
nam2 = ["dep:NeuralAmpModeler-rs"]
# The audio device check (needs the system audio libraries).
devices = ["dep:cpal", "cpal/pipewire"]

[profile.release]
debug = false
