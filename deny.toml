# cargo-deny configuration. CI fails on any dependency whose license is not
# listed here, on known security advisories, and on crates from unknown sources.
# Every license below is compatible with GPL-3.0 (see CREDITS.md).

[graph]
all-features = true
# The six targets we build and ship. Without this list cargo-deny also counts
# dependencies no build of ours compiles, such as rav1e's libfuzzer-sys, which
# exists only under `cfg(fuzzing)`.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (not a vulnerability). It comes in through
    # winit's Wayland window decorations (sctk-adwaita, via Slint) and only
    # reads the bundled decoration font. Revisit when winit moves off it.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, via winit's Wayland decorations; no safe upgrade yet" },
    # zvariant, zvariant_derive and zbus_names are unmaintained as separate
    # crates (not vulnerabilities): zbus 6.0 took them in as modules. They
    # come in through zbus 5, which Slint 1.18's winit backend, AccessKit's
    # Linux screen-reader bridge and the portal file dialogs still use.
    # Revisit on the next Slint upgrade (with ADRs 0006 and 0007's checks).
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; Slint 1.18 and AccessKit still use zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; Slint 1.18 and AccessKit still use zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; Slint 1.18 and AccessKit still use zbus 5" },
    # Slint is pinned to 1.17.1 for a Wayland-only clipboard (ADR 0009). Its
    # code generator (a build dependency, not in the program) takes the image
    # crate with every format, whose AVIF encoder uses `paste`; its SVG
    # support (resvg 0.47) uses `rustybuzz`. Both are unmaintained, not
    # vulnerable. They go when the Slint pin moves.
    { id = "RUSTSEC-2024-0436", reason = "paste, unmaintained; build time only, via Slint 1.17.1's code generator (ADR 0009)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz, unmaintained; via Slint 1.17.1's resvg 0.47 (ADR 0009)" },
    # pulldown-cmark wikilink leak: via i-slint-common 1.17.1, not a direct
    # dependency. Slint 1.18 moves off it; revisit on next Slint upgrade.
    { id = "RUSTSEC-2026-0414", reason = "wikilink sibling-chain leak via Slint 1.17.1; fixed in Slint 1.18" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
]

[licenses.private]
# Our own crates are checked like any other.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
