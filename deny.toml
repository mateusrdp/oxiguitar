# cargo-deny configuration. CI fails on any dependency whose license is not
# listed here, on known security advisories, and on crates from unknown sources.
# Every license below is compatible with GPL-3.0 (see CREDITS.md).

[graph]
all-features = true
# The six targets we build and ship. Without this list cargo-deny also counts
# dependencies no build of ours compiles, such as rav1e's libfuzzer-sys, which
# exists only under `cfg(fuzzing)`.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # ttf-parser is unmaintained (not a vulnerability). It comes in through
    # winit's Wayland window decorations (sctk-adwaita, via Slint) and only
    # reads the bundled decoration font. Revisit when winit moves off it.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, via winit's Wayland decorations; no safe upgrade yet" },
    # zvariant, zvariant_derive and zbus_names are unmaintained as separate
    # crates (not vulnerabilities): zbus 6.0 took them in as modules. They
    # come in through zbus 5, which Slint 1.19's winit backend, AccessKit's
    # Linux screen-reader bridge and the portal file dialogs still use.
    # Revisit on the next Slint upgrade (with ADRs 0006 and 0007's checks).
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; Slint 1.19 and AccessKit still use zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; Slint 1.19 and AccessKit still use zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; Slint 1.19 and AccessKit still use zbus 5" },
    # spin_on uses pin-utils, which is unmaintained (archived Oct 2026), not
    # vulnerable; via Slint 1.19's code generator, macros and renderers.
    { id = "RUSTSEC-2026-0441", reason = "pin-utils, unmaintained; via spin_on in Slint 1.19" },
    # chrono is unmaintained (not a vulnerability; chronotope/chrono#1768).
    # Only i-slint-core 1.19 uses it. Revisit on the next Slint upgrade.
    { id = "RUSTSEC-2026-0543", reason = "chrono, unmaintained; via i-slint-core 1.19" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: unused entries are fine.
unused-allowed-license = "allow"
allow = [
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "MPL-2.0",
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
]

[licenses.private]
# Our own crates are checked like any other.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
